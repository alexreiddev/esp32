; SAFEHOUSE relay nodes. One env per chapter; flash with e.g.
;   pio run -e node1 -t upload
; Regenerate SafehouseNode/campaign_data.h first if the campaign JSON changed:
;   python3 tools/build_campaign.py campaigns/wayanad-east.json

[platformio]
src_dir = SafehouseNode

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:node1]
build_flags = -DNODE_INDEX=1

[env:node2]
build_flags = -DNODE_INDEX=2

[env:node3]
build_flags = -DNODE_INDEX=3

[env:node4]
build_flags = -DNODE_INDEX=4

[env:node5]
build_flags = -DNODE_INDEX=5

[env:node6]
build_flags = -DNODE_INDEX=6
